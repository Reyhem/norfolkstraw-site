<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks — Norfolk Straw</title>
  <meta name="description" content="Your bale enquiry has been received. Norfolk Straw will be in touch within one working day.">
  <style>
    :root{--brand:#a36a1f;--brand-dark:#7a4a12;--ink:#231a12;--muted:#6a5e50;--bg:#fbf8f2;--line:#e1d6bf;--gold:#cf9a3e}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:40px 20px}
    .card{max-width:560px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:42px 36px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.05)}
    h1{font-family:Georgia,serif;font-size:32px;margin:0 0 14px;color:var(--brand)}
    p{color:var(--muted);margin:0 0 12px}
    .logo{font-family:Georgia,serif;font-weight:700;font-size:22px;color:var(--brand);margin-bottom:18px}
    .logo span{color:var(--ink)}
    a.btn{display:inline-block;margin-top:18px;background:var(--brand);color:#fff;padding:11px 22px;border-radius:8px;font-weight:600;text-decoration:none}
    a.btn:hover{background:var(--brand-dark)}
    .note{font-size:13px;color:#8a8275;margin-top:24px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Norfolk<span>Straw</span></div>
    <h1>Thanks — your enquiry is in.</h1>
    <p>We've received your message and will reply with a fixed quote within one working day, usually sooner.</p>
    <p>If it's more urgent, ring the yard on <b>+44 (0)1953 451 022</b>.</p>
    <a class="btn" href="/">Back to homepage</a>
    <div class="note">© 2026 Norfolk Straw · norfolkstraw.co.uk</div>
  </div>
</body>
</html>
